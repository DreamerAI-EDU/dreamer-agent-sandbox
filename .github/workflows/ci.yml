name: Phase 1 Trial Run

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  trial:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug - check key presence
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is SET (length: ${#OPENROUTER_API_KEY})"
            echo "First 8 chars: ${OPENROUTER_API_KEY:0:8}"
          else
            echo "OPENROUTER_API_KEY is EMPTY"
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run trial
        run: python trial_run.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload trace DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-db
          path: traces.db
          retention-days: 7

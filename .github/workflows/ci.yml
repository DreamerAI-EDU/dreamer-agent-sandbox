name: Phase 3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  trial:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trial
        run: python trial_run.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Security agent self-test
        run: python trial_security.py

      - name: Upload trace DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-db
          path: traces.db
          retention-days: 7

  exit-criteria-trials:
    needs: trial
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dependency audit (non-blocking)
        run: pip install pip-audit && pip-audit || true

      - name: Run exit criteria trials
        run: python run_trials.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload trial outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-outputs
          path: output_trials/
          retention-days: 7

  # B31: read-only guard — a test_*.py tracked in repo but missing from the
  # phase2-tests run list would silently never run, so fail RED; a stale
  # list entry (file deleted) is only a warning. No build dependency.
  ci-manifest-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: CI manifests vs test suite consistency guard
        run: python scripts/check_ci_manifest.py

  phase2-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Phase 2 + Phase 3 + Phase 4 + Phase 5 tests
        # test_concurrent.py not included — requires real container + real token,
        # managed via trial_ws.py end-to-end smoke test instead.
        run: pytest tests/test_ws_client.py tests/test_session_manager.py tests/test_kid_safe_pipeline.py tests/test_kid_safe_wiring.py tests/test_tone_rewrite.py tests/test_label_soften.py tests/test_session_wrap.py tests/test_error_templates.py tests/test_ethical_ai_kb.py tests/test_registry.py tests/test_subagents.py tests/test_input_guard.py tests/test_assessment_agent.py tests/test_assessment_db.py tests/test_mode_router.py tests/test_build_plan.py tests/test_curriculum_navigator.py tests/test_execute.py tests/test_observability.py tests/test_parent_report_agent.py tests/test_seed_kb.py tests/test_phase1_kb_export.py tests/test_kb_names_in_code_subset_of_manifest.py tests/test_portfolio_agent.py tests/test_b26_zh_cn_guard.py tests/test_auth.py tests/test_consent.py tests/test_students.py tests/test_invites.py tests/test_safety_review.py tests/test_w2_p3_batch.py tests/test_plan_agent.py tests/test_health_monitor.py tests/test_w3c_notifications.py -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend/
        run: npm ci

      - name: Lint
        working-directory: frontend/
        run: npm run lint

      - name: Build
        working-directory: frontend/
        run: npm run build

  # P2: auto build + push dreamer-api image to GHCR on main merge.
  # Kills the manual push gap (blocked twice already). Image only builds on
  # fully-green main (deployable-at-main principle). PRs never push.
  docker-push:
    needs: [trial, exit-criteria-trials, ci-manifest-guard, phase2-tests, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t ghcr.io/dreamerai-edu/dreamer-api:$SHORT_SHA .

      - name: Push image
        run: docker push ghcr.io/dreamerai-edu/dreamer-api:$SHORT_SHA

      - name: Show pushed digest
        run: docker images --digests ghcr.io/dreamerai-edu/dreamer-api:$SHORT_SHA

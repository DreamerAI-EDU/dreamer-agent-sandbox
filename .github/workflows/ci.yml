name: Phase 1 Trial Run

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  trial:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trial
        run: python trial_run.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload trace DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-db
          path: traces.db
          retention-days: 7

  exit-criteria-trials:
    needs: trial
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run exit criteria trials
        run: python run_trials.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload trial outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-outputs
          path: output_trials/
          retention-days: 7

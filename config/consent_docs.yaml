# W2 PR#2 — consent document registry (single source of truth for versions).
#
# The version number is part of the legal evidence chain: any word change in
# a document = new current_version. Old signatures never auto-upgrade.
#   - required: true  -> a new version forces re-sign on next login (PR#2 §3 gate)
#   - required: false -> old agreement still counts; only new signatures use
#                        the new version (no user nagging)
#
# The embedded legal pages (/legal/*) and the /api/consent/docs response both
# read current_version from this file — never hardcode the version in two
# places (test 11 asserts the pairing).

#   - roles: [parent] -> doc is scoped to those roles; classroom staff
#                        accounts (teacher / admin) never enter this gate.
#              [teacher, admin] -> staff paperwork: the parent/child docs
#                        above never bind staff, and this doc never binds
#                        parents (W6 PR-G). Absent key = every role.

documents:
  privacy_policy:
    current_version: "v2026-08-26"
    required: true          # 必簽：唔簽完成唔到家長確認
    roles: ["parent"]
    title_zh: "私隱政策"
    title_en: "Privacy Policy"
  media_consent:
    current_version: "v2026-08-26"
    required: false         # 自願：唔剔都註冊到
    roles: ["parent"]
    title_zh: "媒體同意書"
    title_en: "Media Consent Form"
  chat_consent:
    current_version: "v2026-09-08"
    required: true          # W6 PR-D default-deny flip：chat gate 讀呢個 flag，未簽唔開 AI 對話
    roles: ["parent"]
    title_zh: "AI 對話服務同意書"
    title_en: "AI Chat Service Consent"
  # c1-13b Phase 1 - voice input (P1-S3, all bands). LANDED 2026-10-08: the copy
  # was
  # approved and shipped as a new section of the EXISTING signup consent page
  # (no separate flow), so this is a normal, parent-visible document now —
  # /legal/voice-consent carries the text and parents tick it in the app.
  # SCOPE WIDENED 2026-10-09 (v2026-10-09): the "P1-P3 trial" sentence in all
  # three languages became a P1-S3 availability sentence; no new translation,
  # one sentence per language, effective date moved to 9 October 2026.
  # It keeps its OWN doc_type on purpose: one registry row per document is what
  # makes voice revocable on its own (a parent may stop the mic and keep the
  # text-only service; the withdrawn row is what the mic gate reads).
  # required: false is deliberate — voice is voluntary, so declining it never
  # blocks signup and never forces an existing family to re-sign. The
  # default-deny mic gate (auth/voice_quota.py) is what keeps the microphone
  # off until a current-version agreed row exists for that child.
  voice_consent:
    current_version: "v2026-10-09"
    required: false         # 自願：唔剔都註冊到（mic gate 另有 default-deny）
    roles: ["parent"]
    title_zh: "語音輸入同意書"
    title_en: "Voice Input Consent"
  staff_data_processing:
    current_version: "v2026-09-10"
    required: true          # W6 PR-G：staff 必簽，未簽唔入到後台
    roles: ["teacher", "admin"]
    title_zh: "職員資料處理守則"
    title_en: "Staff Data Processing Notice"

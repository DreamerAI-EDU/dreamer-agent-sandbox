# c1-13b Phase 1 — Voice input (P1-P3 trial) relay configuration.
#
# Boss-signed 實施令 2026-10-04 (Azure main / Deepgram dormant). No secrets
# live here: both provider keys stay in the host .env (AZURE_SPEECH_KEY /
# DEEPGRAM_API_KEY) and never enter the repo, the evidence pack or any log.

feature_flag:
  # Master switch for the mic button. Default OFF everywhere; during the
  # trial only the test accounts are enabled (env VOICE_P1P3_ENABLED=1 can
  # flip a single environment without a code change).
  voice_p1p3: false
  # Only the P1-P3 band may see the mic. The band is read from the student
  # record server-side — a URL query param is never trusted for this.
  bands: ["P1-P3"]

stt:
  provider: azure            # azure | deepgram  (env STT_PROVIDER overrides)
  azure:
    region: eastasia         # 對測定案：East Asia，唔准改
    language_default: "en-US"
    language_map:
      en: "en-US"
      hk: "zh-HK"
      cn: "zh-CN"
    # Azure endpoint logging was switched off at provisioning time (screenshot
    # evidence kept out-of-band); recorded here so the state is auditable and
    # a custom model is forbidden — the 對測 result is bound to the base model.
    endpoint_logging: false
    custom_model_allowed: false
  deepgram:
    # Dormant backup, shipped in the same PR so the switch day needs no code.
    model: "nova-3"
    # MANDATORY on every Deepgram call: model-improvement opt-out, exactly as
    # measured in the 對測. Removing it silently changes the data terms.
    mip_opt_out: true
    smart_format: true

limits:
  # 三道閘 #2/#3 — app-layer minute meters (the Azure budget alert is gate #1).
  max_segment_seconds: 60          # env VOICE_MAX_SEGMENT_SECONDS
  daily_student_seconds: 900       # 15 min / student / day — env VOICE_DAILY_STUDENT_SECONDS
  # Global monthly minute meter: voice auto-stops when it is reached.
  # Default = monthly budget $50 ÷ S0 $1.00/audio-hour = 50 h = 3000 min.
  # env VOICE_MONTHLY_GLOBAL_SECONDS
  monthly_global_seconds: 180000
  max_upload_bytes: 2097152        # a 60 s compressed clip is far below this

alerts:
  # Azure Cost Management monthly budget, 50/80/100% e-mail alerts (portal-side).
  monthly_budget_usd: 50
  # Recipient comes from the host env (name below): a mailbox address is
  # operator data, not repo data — when unset the alert is audit-only.
  alert_to_env: "VOICE_ALERT_TO"
